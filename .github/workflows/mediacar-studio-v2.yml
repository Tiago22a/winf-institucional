name: MediaCar Studio V2 — coleção e cotas 08
on:
  pull_request:
    paths:
      - 'partners/carro-midia/index.html'
      - 'css/mediacar-studio-v2.css'
      - 'media/brands/winf-logo-*'
      - 'tests/mediacar-studio-v2.test.cjs'
      - '.github/workflows/mediacar-studio-v2.yml'
  push:
    branches: [main]
    paths:
      - 'partners/carro-midia/index.html'
      - 'css/mediacar-studio-v2.css'
      - 'tests/mediacar-studio-v2.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar simulador v2 e integração v1
        run: node --test tests/mediacar-studio-v2.test.cjs tests/mediacar-footer.test.cjs
