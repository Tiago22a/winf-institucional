name: WINF — Cloudflare Cache
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winf-cloudflare-cache-main
  cancel-in-progress: true

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SITE_URL: https://www.winf.com.br
    steps:
      - name: Validar credenciais e configuracao
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ZONE_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ZONE_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ZONE_ID"

      - name: Esperar propagacao da publicacao
        shell: bash
        run: |
          # Este repositorio nao possui um deploy central integrado ao Actions.
          # Aguarda a janela de publicacao do host antes de invalidar o cache.
          sleep 90

      - name: Verificar disponibilidade do dominio
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/?winf_deploy_check=${GITHUB_SHA}" || true)
            if [[ "$status" == "200" ]]; then
              echo "Dominio respondeu HTTP 200 (tentativa $attempt)."
              exit 0
            fi
            echo "Tentativa $attempt: HTTP $status. Nova tentativa em 20 segundos."
            sleep 20
          done
          echo "::error::Dominio nao respondeu HTTP 200; cache preservado."
          exit 1

      - name: Limpar cache da Cloudflare
        shell: bash
        run: |
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --retry 3 --retry-delay 4 --max-time 45 \
            -o "$response_file" -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')
          if [[ "$http_code" != "200" ]] || ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("success") is True else 1)' "$response_file"; then
            echo "::error::Cloudflare rejeitou a limpeza (HTTP $http_code). Confira permissao Zone Cache Purge e Zone ID."
            # Nao imprimir resposta completa, pois pode conter detalhes de conta.
            exit 1
          fi
          echo "Cloudflare confirmou purge_everything para a zona configurada."
