name: WINF — Diretório territorial na home
on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/winf-active-territories.css'
      - 'tests/winf-regionais-home.test.cjs'
      - '.github/workflows/winf-regionais-home.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/winf-active-territories.css'
      - 'tests/winf-regionais-home.test.cjs'
      - '.github/workflows/winf-regionais-home.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-diretorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/winf-regionais-home.test.cjs
