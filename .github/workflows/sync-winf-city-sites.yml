name: WINF Select — Sincronizar sites de cidades
on:
  push:
    branches: [main]
    paths:
      - 'pelicula-de-controle-solar-santos-sp/index.html'
      - 'config/winf-active-cities.json'
      - 'scripts/sync-winf-city-sites.mjs'
      - 'config/winf-neighborhoods.json'
      - 'scripts/winf-city-territory.mjs'
      - 'scripts/winf-city-applications.mjs'
      - 'scripts/winf-city-search-language.mjs'
      - 'config/winf-city-intents.json'
      - 'scripts/winf-city-intent-clusters.mjs'
      - 'scripts/check-winf-city-intents.mjs'
      - 'scripts/check-winf-city-search-language.mjs'
      - 'scripts/winf-social-sitewide.mjs'
      - 'scripts/check-winf-social-sitewide.mjs'
      - 'config/winf-social-content.json'
      - '.github/workflows/sync-winf-city-sites.yml'
      - 'index.html'
      - '**/index.html'
      - 'scripts/check-winf-applications.mjs'
      - 'scripts/check-winf-search-readiness.mjs'
      - 'sitemap.xml'
      - 'aplicacoes/**'
      - 'scripts/apply-winf-territory-template.mjs'
      - 'scripts/check-winf-territory-seo.mjs'
      - 'scripts/winf-city-seo.mjs'
      - 'scripts/build-winf-social-images.mjs'
      - 'scripts/check-winf-seo.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar ferramenta de imagem Sharp
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Atualizar template territorial Santos
        run: |
          node --check scripts/winf-city-territory.mjs
          node --check scripts/winf-city-applications.mjs
          node --check scripts/winf-city-search-language.mjs
          node --check scripts/winf-city-intent-clusters.mjs
          node --check scripts/apply-winf-territory-template.mjs
          node scripts/apply-winf-territory-template.mjs
      - name: Gerar 7 imagens sociais premium com logo oficial
        run: |
          node --check scripts/build-winf-social-images.mjs
          node scripts/build-winf-social-images.mjs
      - name: Sincronizar sites e validar metadados
        run: |
          node --check scripts/winf-city-seo.mjs
          node --check scripts/sync-winf-city-sites.mjs
          node --check scripts/check-winf-seo.mjs
          node scripts/sync-winf-city-sites.mjs
          node scripts/sync-winf-city-sites.mjs --check
          node scripts/check-winf-seo.mjs
          node --check scripts/check-winf-territory-seo.mjs
          node scripts/check-winf-territory-seo.mjs
          node --check scripts/check-winf-applications.mjs
          node scripts/check-winf-applications.mjs
          node --check scripts/check-winf-search-readiness.mjs
          node scripts/check-winf-search-readiness.mjs
          node scripts/check-winf-city-search-language.mjs
          node --check scripts/check-winf-city-intents.mjs
          node scripts/check-winf-city-intents.mjs
      - name: Criar 1200x630 OG + EXIF, títulos contextuais e links limpos
        run: |
          node --check scripts/winf-social-sitewide.mjs
          node scripts/winf-social-sitewide.mjs
          node --check scripts/check-winf-social-sitewide.mjs
          node scripts/check-winf-social-sitewide.mjs
      - name: Commitar capas sociais e HTML padronizado
        run: |
          git add -u -- .
          git add -- images/og/winf-*.jpg docs/seo/winf-social-audit.json
          if ! git diff --cached --quiet; then
            git config user.name "WINF Social SEO"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(social): capas por pagina e metadados completos [skip ci]"
            git push
          else
            echo "Metadados e capas já estão sincronizados."
          fi
