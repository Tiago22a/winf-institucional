name: WINF Partners — Editorial Asset Light
on:
  pull_request:
    paths:
      - "partners/index.html"
      - "partners/landing.css"
      - "tests/partners-asset-light-editorial.test.cjs"
      - ".github/workflows/partners-asset-light-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/partners-asset-light-editorial.test.cjs
