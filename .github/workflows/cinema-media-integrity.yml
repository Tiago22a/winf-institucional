name: WINF Cinema — Integridade de mídias e fallback
on:
  pull_request:
    paths:
      - 'media/ecossistema/**'
      - 'briefing/media/winf-dominio-absoluto-manha.*'
      - 'js/winf-cinema.js'
      - 'css/winf-cinema.css'
      - 'briefing/index.html'
      - 'mediacar/index.html'
      - 'partners/cuidar-e-conectar/index.html'
      - 'partners/universo-dark/index.html'
      - 'ghost-shop/index.html'
      - 'synthwave/index.html'
      - 'synthwave/radio/index.html'
      - 'synthwave/app.js'
      - 'synthwave/profile.js'
      - 'synthwave/radio-theme.css'
      - 'synthwave/assets/retro-radio.svg'
      - 'tests/cinema-media-integrity.test.cjs'
      - '.github/workflows/cinema-media-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'media/ecossistema/**'
      - 'briefing/media/winf-dominio-absoluto-manha.*'
      - 'js/winf-cinema.js'
      - 'css/winf-cinema.css'
      - 'synthwave/index.html'
      - 'synthwave/radio/index.html'
      - 'synthwave/app.js'
      - 'synthwave/profile.js'
      - 'synthwave/radio-theme.css'
      - 'synthwave/assets/retro-radio.svg'
      - 'tests/cinema-media-integrity.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe do player
        run: node --check js/winf-cinema.js
      - name: Conferir sintaxe da plataforma de rádio e perfil
        run: |
          node --check synthwave/app.js
          node --check synthwave/profile.js
      - name: Testar rotas, pôsteres e fontes alternativas
        run: node --test tests/cinema-media-integrity.test.cjs
