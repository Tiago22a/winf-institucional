name: Homologação WINF — Atendimento 200 municípios
on:
  pull_request:
    paths:
      - 'aerocore/assets/onde-comprar.js'
      - 'onde-comprar/index.html'
      - 'index.html'
      - 'config/winf-territorios-consumidor-200.json'
      - 'tests/winf-atendimento-200-*.test.mjs'
      - '.github/workflows/winf-atendimento-200-homologacao.yml'
  workflow_dispatch:
jobs:
  validar-catalogo-e-rotas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar 200 cidades, fallback, CRM separado e URLs
        run: node --test tests/winf-atendimento-200-*.test.mjs
      - name: Lint sintático do localizador
        run: node --check aerocore/assets/onde-comprar.js
      - name: Garantir regressão do localizador anterior
        run: node tests/check-locators.mjs
