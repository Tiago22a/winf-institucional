name: WINF Partners Lead Routing
on:
  pull_request:
    paths:
      - 'partners/partners.js'
      - 'briefing/index.html'
      - 'tests/partnersLeadRouting.test.cjs'
      - '.github/workflows/partners-lead-routing.yml'
  push:
    branches: ['fix/partners-lead-routing-investor-importer-20261106']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client script syntax
        run: node --check partners/partners.js
      - name: Simulate WhatsApp leads from all audiences
        run: node --test tests/partnersLeadRouting.test.cjs
